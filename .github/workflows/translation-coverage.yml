name: Traditional Chinese translation coverage

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gettext
        run: sudo apt-get update -qq && sudo apt-get install -y gettext
      - name: Verify the shipped Traditional Chinese catalog
        run: bash .github/scripts/check-zh-tw-coverage.sh
